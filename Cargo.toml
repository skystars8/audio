[package]
name = "chess-voice-studio"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Linux-first offline text-to-speech studio with large Piper voice packs"

[dependencies]
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
md5 = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
